<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nagpur Safety Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="map"></div>

  <!-- Floating button to start reporting an incident -->
  <button id="reportBtn" type="button" class="btn btn-danger rounded-circle report-fab" title="Report an Incident">+</button>

  <!-- Shown while the user is picking a location on the map -->
  <div id="pickLocationBanner" class="pick-location-banner d-none">
    Tap/click anywhere on the map to drop a pin
    <button id="cancelPick" type="button" class="btn btn-sm btn-light ms-2">Cancel</button>
  </div>

  <!-- Legend showing what each marker color means -->
  <div id="mapLegend" class="map-legend"></div>

  <!-- Report form modal -->
  <div class="modal fade" id="reportModal" tabindex="-1" aria-labelledby="reportModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="reportForm">
          <div class="modal-header">
            <h5 class="modal-title" id="reportModalLabel">Report an Incident</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <p class="text-muted small">This report is completely anonymous. No personal data is collected.</p>

            <div class="mb-3">
              <label for="category" class="form-label">Category</label>
              <select class="form-select" id="category" required>
                <option value="" disabled selected>Select a category</option>
                <option value="Harassment">Harassment</option>
                <option value="Poor Lighting">Poor Lighting</option>
                <option value="Accident">Accident</option>
                <option value="Crime">Crime</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="incidentTime" class="form-label">When did this happen?</label>
              <input type="datetime-local" class="form-control" id="incidentTime" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Location</label>
              <p id="selectedCoords" class="form-control-plaintext text-muted small mb-0"></p>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-danger">Submit Report</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/map.js"></script>
  <script src="js/report-form.js"></script>
</body>
</html>
