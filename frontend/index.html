<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nagpur Safety Map</title>

  <!-- Leaflet's own CSS - required for the map to render/look correct -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Bootstrap CSS - we'll use this for the report form in Part 2 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Our own custom styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- This empty div is where Leaflet will draw the actual map -->
  <div id="map"></div>

  <!-- Leaflet's JavaScript library -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Bootstrap's JavaScript (needed for form components later) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Our own script that actually initializes the map -->
  <script src="js/map.js"></script>
</body>
</html>
